<main class="mx-auto max-w-2xl p-8">
  <div hlmCard>
    <div hlmCardHeader>
      <h1 hlmCardTitle>IVS-Nachführungstool — Prototyp</h1>
      <p hlmCardDescription>
        Setup-Verifikation. Diese Seite wird durch die Prototypen-Übersicht ersetzt.
      </p>
    </div>

    <div hlmCardContent class="space-y-6">
      <div class="flex flex-wrap gap-2">
        <span hlmBadge>Angular</span>
        <span hlmBadge variant="secondary">Tailwind CSS v4</span>
        <span hlmBadge variant="outline">spartan/ui</span>
        <span hlmBadge variant="outline">ArcGIS Maps SDK</span>
      </div>

      <div hlmSeparator></div>

      <div class="space-y-2">
        <label hlmLabel for="probe">Eingabefeld</label>
        <input hlmInput id="probe" placeholder="z. B. VS 1.2.14" class="w-full" />
      </div>

      <div class="flex flex-wrap gap-2">
        <button hlmBtn>Primär</button>
        <button hlmBtn variant="secondary">Sekundär</button>
        <button hlmBtn variant="outline">Umriss</button>
        <button hlmBtn variant="ghost">Ghost</button>
        <button hlmBtn variant="destructive">Destruktiv</button>
      </div>
    </div>
  </div>
</main>
