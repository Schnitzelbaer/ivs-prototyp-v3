<div class="min-h-screen">
  <header class="bg-background/85 sticky top-0 z-30 border-b backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center gap-4 px-6 py-3">
      <div class="min-w-0">
        <h1 class="truncate text-sm font-semibold tracking-tight">Kitchen Sink</h1>
        <p class="text-muted-foreground truncate text-xs">
          Alle spartan/ui-Komponenten im Theme des IVS-Prototyps
        </p>
      </div>
      <button hlmBtn variant="outline" size="sm" class="ms-auto shrink-0" (click)="toggleTheme()">
        {{ themeLabel() }}
      </button>
    </div>
  </header>

  <div class="mx-auto flex max-w-6xl gap-8 px-6 py-8">
    <nav class="hidden w-48 shrink-0 lg:block">
      <ul class="sticky top-20 space-y-0.5">
        @for (entry of nav; track entry.id) {
          <li>
            <a
              class="text-muted-foreground hover:bg-muted hover:text-foreground block rounded-md px-2 py-1.5 text-sm"
              [href]="'#' + entry.id"
              >{{ entry.label }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <main class="min-w-0 flex-1 space-y-12">
      <ks-typography-section />
      <ks-actions-section />
      <ks-display-section />
      <ks-forms-section />
      <ks-data-section />
      <ks-overlays-section />
      <ks-navigation-section />
      <ks-layout-section />
    </main>
  </div>
</div>
